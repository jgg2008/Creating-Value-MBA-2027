/* ================= System check: crises, dividends, endings ================= */
function systemCheck(){
  const out=[];
  /* accumulated consequences of spending cuts */
  for(const k in CUT_EVENTS){
    for(const ce of CUT_EVENTS[k]){
      const tag='cut_'+k+'_'+ce.at;
      if(CUTS[k]>=ce.at && !has(tag)){ FLAGS.add(tag); const dlt=apply(ce.e); out.push({cls:'crisis',t:ce.t+' · cuts in '+CUTAREAS[k].n.toLowerCase(),d:ce.d,chips:dlt}); }
    }
  }
  for(const cf of CUT_FATIGUE){ const tag='cut_fatiga_'+cf.at; if(totalCuts()>=cf.at && !has(tag)){ FLAGS.add(tag); const dlt=apply(cf.e); out.push({cls:'crisis',t:cf.t+' · '+totalCuts()+' cuts',d:cf.d,chips:dlt}); } }
  for(const d of DIMS){
    const k=d.k;
    if(S[k]<50){
      if(!has('cr_'+k)){
        FLAGS.add('cr_'+k);
        const c=CRISIS[k]; let e=c.e, x='';
        if(c.fn){const r=c.fn(); e=r.e; x=r.x;}
        const dlt=apply(e);
        out.push({cls:'crisis',t:c.t+' · '+d.n+' below 50',d:c.d+(x?' '+x:''),chips:dlt});
      } else {
        apply({[k]:-2});
        out.push({cls:'bad',t:d.n+' still below 50',d:'The crisis hasn’t been resolved and is getting worse: every month without a response costs more. (−2 '+d.n+')'});
      }
    }
  }
  for(const d of DIMS){
    const k=d.k;
    if(S[k]>=80 && !has('bo_'+k)){
      FLAGS.add('bo_'+k);
      const b=BONUS[k]; const dlt=apply(b.e);
      out.push({cls:'bonus',t:b.t+' · '+d.n+' above 80',d:b.d,chips:dlt});
    }
  }
  OVER=overCheck();
  return out;
}
function overCheck(){
  if(S.eco<30) return 'quiebra';
  if(S.bie<25) return 'colapso';
  if(S.com<25) return 'bloqueo';
  if(S.mot<25) return 'renuncia';
  if(S.rep<25) return 'marca';
  if(S.amb<25) return 'clausura';
  if(S.tur<25) return 'vacio';
  if(S.due<25) return 'despido';
  if(DIMS.filter(d=>S[d.k]<50).length>=5) return 'sistemico';
  return null;
}

  }).join('');
}

   <div class="idnote">${reg?'Your results are logged automatically when each session closes and when you finish, along with your name and your decisions.':'It is used in the summary you can copy at the end.'}</div>
   <div class="idwarn" id="idwarn">Enter your name or code so your results can be logged.</div>
  </div>`;
}
function readIdentity(){
  const n=document.getElementById('pname'), g=document.getElementById('pgroup');
  PLAYER.name=(n?n.value:'').trim(); PLAYER.group=CONFIG.GRUPO_FIJO||(g?g.value:'').trim();
  if(CONFIG.SHEET_ENDPOINT && !PLAYER.name){ const w=document.getElementById('idwarn'); if(w)w.style.display='block'; if(n)n.focus(); return false; }
  saveIdentity(); return true;
}
function startGame(){ if(!readIdentity())return; reset(); stageIdx=0; stageIntro(); }
function jumpTo(n){ if(!readIdentity())return; reset(); S={...NEUTRAL}; stageIdx=n-1; PLAYER.modo='session '+n; stageIntro(); }
function resume(){
  const sv=load(); if(!sv){intro();return;}
  reset();
  S={...sv.S}; FLAGS=new Set(sv.F||[]); LOG=sv.LOG||[]; stageIdx=sv.si; decIdx=sv.di||0; CHECK=sv.CHECK||null; CHECK_PREV=sv.CHECK_PREV||null; CUTS=sv.CUTS||{mant:0,pers:0,mkt:0,amb:0}; CUT=null; if(sv.PLAYER) PLAYER={...PLAYER,...sv.PLAYER}; if(!PLAYER.partida) PLAYER.partida=newId();
  if(sv.phase==='gate') stageIntro();
  else if(sv.phase==='close') stageClose();
  else if(sv.phase==='oferta') showOferta();
  else if(sv.phase==='dec'){ if(decIdx>=STAGES[stageIdx].dec.length) stageClose(); else showDecision(); }
  else stageIntro();
}

/* ================= Stage flow ================= */
function stageIntro(){
  const st=STAGES[stageIdx];
  if(!isUnlocked(st.n)){ gateScreen(); return; }
  CHECK_PREV=CHECK; CHECK=snapshot();
  renderBoard('Session '+st.n+' · '+st.mes);
  const evs=[...st.evs(), ...systemCheck()];
  renderBoard('Session '+st.n+' · '+st.mes);
  if(OVER){ gameOver(OVER, CHECK_PREV||CHECK, 'Session '+st.n+' · '+st.mes); return; }
  decIdx=0; save('dec');
  screen(`
   <div class="eyebrow">Stage ${st.n} · ${st.mes}</div>
   <h2>${st.t}</h2>
   <div class="sesion"><b>Session ${st.n}: ${st.ses}.</b> ${st.marco}</div>
   <p class="ctx">${st.ctx}</p>

   ${eventsHtml(evs)}
   <button class="btn" onclick="decIdx=0;showDecision()">See the first decision</button>`);
}
function gateScreen(){
  const st=STAGES[stageIdx];
  renderBoard('Session '+st.n+' · access');
  save('gate');
  screen(`
   <div class="eyebrow">Stage ${st.n} · ${st.mes}</div>
   <h2>${st.t}</h2>

     <div class="sesion" style="margin:0 0 .5rem"><b>Session ${st.n}: ${st.ses}.</b> This stage is unlocked in class.</div>
     <label for="gkey" style="font-size:.85rem">Enter the key your instructor gives you for session ${st.n}</label>
     <input id="gkey" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="····" onkeydown="if(event.key==='Enter')tryKey()">
     <div class="gerr" id="gerr"></div>
     <button class="btn" onclick="tryKey()">Open session ${st.n}</button>
     <div class="ghint">Your progress so far is saved on this device. You can close this and come back when you have the key.</div>
   </div>

}
function tryKey(){
  const st=STAGES[stageIdx], i=document.getElementById('gkey'), e=document.getElementById('gerr');
  if(checkKey(st.n, i?i.value:'')){ markUnlocked(st.n); stageIntro(); return; }
  if(e){ e.textContent='Wrong key for session '+st.n+'. Check with your instructor.'; }
  if(i){ i.value=''; i.focus(); }
}
let ORDER=[];
function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function showDecision(){
  const st=STAGES[stageIdx], d=st.dec[decIdx];
  ORDER=shuffled(d.opts.length);
  renderBoard('Session '+st.n+' · '+st.mes);
  screen(`
   <div class="eyebrow">Stage ${st.n} · ${st.mes} · decision ${decIdx+1} of ${st.dec.length}</div>
   <div class="qcard">
     <div class="q">${d.q}</div>
     ${d.v?'<h3 style="margin-top:0">What you hear around the table</h3>':''}
     ${voicesHtml(d.v)}
     <h3>What do you decide?</h3>
     ${ORDER.map(i=>`<button class="opt" onclick="choose(${i})"><b>${d.opts[i].l}</b>${affectsHtml(d.opts[i])}</button>`).join('')}
     ${cutPanelHtml()}
   </div>`);
}
function cutPanelHtml(){
  CUT=null;
  const n=totalCuts();
  return `<div class="cutbox">
     <div class="cut-t">Spending cut <span>· optional, applied along with your choice${n?` · ${n} so far`:''}</span></div>
     <div class="cut-d">Esteban says it at every meeting: “there’s always something to cut.” It improves cash immediately; the savings dry up if you keep cutting the same area, and the area you cut feels it, with consequences that accumulate.</div>
     <div class="cut-chips">
       <button class="cutc sel" data-cut="" onclick="setCut(null)">No cut</button>
       ${Object.keys(CUTAREAS).map(k=>`<button class="cutc" data-cut="${k}" onclick="setCut('${k}')">${CUTAREAS[k].n}</button>`).join('')}
     </div></div>`;
}
function setCut(k){
  CUT=k;
  document.querySelectorAll('.cutc').forEach(b=>b.classList.toggle('sel',(b.dataset.cut||null)===k));
}
function applyCut(){
  if(!CUT||!CUTAREAS[CUT]) return null;
  const k=CUT, a=CUTAREAS[k], n=CUTS[k];
  const gain=CUT_GAIN[Math.min(n,CUT_GAIN.length-1)], m=CUT_MULT(n);
  CUTS[k]=n+1;
  const side={}; for(const d in a.e) side[d]=a.e[d]*m;
  const dlt=apply(gain?{eco:gain, ...side}:side);
  CUT=null;
  const r=(gain?a.r:'There’s nothing left to cut here: the savings are zero and the damage continues.')+(m>1?' Each repeated cut hits harder than the last.':'');
  return {k, n:a.n, dlt, r, gain};
}
function choose(i){
  const st=STAGES[stageIdx], d=st.dec[decIdx], o=d.opts[i];
  const delta = apply({...(o.e||{})});
  const extra = o.mod ? (o.mod()||{}) : {};
  merge(delta, apply(extra));
  if(o.flag) (Array.isArray(o.flag)?o.flag:[o.flag]).forEach(f=>FLAGS.add(f));
  if(o.unflag) FLAGS.delete(o.unflag);
  let fb = o.fdyn ? o.fdyn() : (o.f||'');
  if(o.fmod) fb += o.fmod();
  const cut = applyCut();
  LOG.push({et:'Session '+st.n, q:d.q, l:o.l, cut:cut?cut.n:null});
  renderBoard('Session '+st.n+' · '+st.mes);
  const last = decIdx>=st.dec.length-1;
  if(last){ save('close'); } else { decIdx++; save('dec'); decIdx--; }
  screen(`
   <div class="eyebrow">Stage ${st.n} · ${st.mes}</div>
   <p class="chosen">You chose: <b>${o.l}</b>${o.c?`<br><span style="font-style:italic">${o.c}</span>`:''}</p>
   ${chipsHtml(delta)}
   ${cut?`<div class="cut-note"><b>Cut in ${cut.n.toLowerCase()}</b> (${ord(CUTS[cut.k])} time): ${cut.r}</div>${chipsHtml(cut.dlt)}`:''}
   <span class="fb-tag">COURSE DEBRIEF</span>
   <div class="fb-box">${fb}</div>
   ${o.k?`<p class="marco"><b>Framework:</b> ${o.k}</p>`:''}
   <button class="btn" onclick="${last?'stageClose()':'decIdx++;showDecision()'}">${last?'Close session '+st.n:'Next decision'}</button>`);
}
function stageClose(){
  const st=STAGES[stageIdx];
  renderBoard('Session '+st.n+' · close');
  save('close');

  const lows=DIMS.filter(d=>S[d.k]<50), highs=DIMS.filter(d=>S[d.k]>=80);

   ${highs.length?`<div class="notice bonus"><b>In the excellence zone: ${highs.map(d=>d.n).join(', ')}.</b>Above 80, the system starts paying dividends.</div>`:''}
   <div class="qclase"><b>For class discussion · Session ${st.n}</b><ol>${(Array.isArray(st.qc)?st.qc:[st.qc]).map(q=>`<li>${q}</li>`).join('')}</ol></div>
   <p class="ctx" style="font-size:.8rem;color:var(--gray)">Your progress is saved on this device. You can close this and come back at the next session.</p>
   <button class="btn" onclick="${isLast?'ending()':(oferta?'showOferta()':'nextStage()')}">${isLast?'See the year’s results':(oferta?'Continue':'Continue to session '+(st.n+1)+(isUnlocked(st.n+1)?'':' · with today’s key'))}</button>
   <button class="btn ghost" onclick="copyResumen(this)">Copy my progress</button>`);
}

/* ================= Endings ================= */
function avg(){return Math.round(DIMS.reduce((a,d)=>a+S[d.k],0)/DIMS.length);}
function nextSeason(){return Math.max(15,Math.min(98,Math.round(S.tur*0.45+S.rep*0.3+S.com*0.25)));}
function ebitda(){ const p=Math.round((S.eco-60)*0.8+(S.amb-60)*0.25); return (p>0?'+':'')+p+'%'; }
function cst(){ return S.amb>=80?'Elite':(S.amb>=65?'Advanced':(S.amb>=50?'Basic':'At risk')); }
function rotacion(){ return S.mot>=80?'Low':(S.mot>=65?'Normal':(S.mot>=50?'High':'Critical')); }
function verdict(){
  const a=avg(), lows=DIMS.filter(d=>S[d.k]<50).length, highs=DIMS.filter(d=>S[d.k]>=80).length;
  if(lows===0 && highs===DIMS.length) return {cls:'win',t:'Regenerative benchmark',
   d:'All eight dimensions above 80. The hotel closes the year with the best margin in its history, elite certification, the ASADA as a partner, suppliers who grew with you and a team that owns the system. The owners delegate strategy to you and your family recognizes you. INCAE asks to write the case.'};
  if(lows===0 && highs>=6 && a>=80) return {cls:'win',t:'Shared value, proven',
   d:'You turned the worst drought in decades and the most expensive diesel into a competitive advantage: economic and sustainable results at the same time, with data any third party can verify. One or two dimensions still need to reach the excellence zone; the system already knows how.'};
  if(lows===0 && a>=70) return {cls:'mid',t:'Integrated strategy, under construction',
   d:'The hotel ends the year standing and with structure: nothing fell below 50 and several decisions built capabilities. Sustainability still needs to change more business decisions, and results still need to reach the excellence zone.'};
  if(lows<=1 && a>=58) return {cls:'mid',t:'Survived, with scars',
   d:'The hotel makes it through the season, but one dimension ended up in the crisis zone and the system remembers it. Some decisions were costly and left lessons; others built structure. The next drought will tell which weighed more.'};
  return {cls:'bad',t:'A lost season',
   d:'The hotel survives, but with several dimensions in the crisis zone: harsh reviews, a distant community, a tired team, impatient owners or depleted cash. Next year starts uphill: trust will have to be rebuilt with actions.'};
}
function lessonsHtml(){
  const L=[];
  const ok=(c,t)=>{if(c)L.push(`<div class="ok">✔ ${t}</div>`)};
  const miss=(c,t)=>{if(c)L.push(`<div class="miss">△ ${t}</div>`)};
  ok(has('estrategia'),'Session 1 · You treated sustainability as strategy: it changed business decisions, not just the donations budget.');
  ok(has('matriz'),'Session 2 · You prioritized with double materiality and outside validation: five topics with an owner are worth more than twenty by consensus.');
  ok(has('linea_base'),'Session 3 · You built a baseline: every promise had a denominator, and that saved you in the crisis and with the bank.');
  ok(has('rediseno')||has('circular'),'Session 4 · You redesigned the model instead of restricting it: scarcity became a value proposition and a source of productivity.');
  ok(has('proveedores')||has('diligencia'),'Session 5 · You took the strategy into the supply chain: supplier development and due diligence with remediation.');
  ok(has('solar')&&has('caso_honesto'),'Session 6 · You translated sustainability into finance with causality and sensitivity analysis, and declared the uncertainty.');
  ok(has('incentivos')||has('experimento'),'Session 7 · You closed the purpose gap where it actually closes: well-designed incentives and resistance treated as information.');
  ok(has('asada'),'Session 8 · You broke the tragedy of the commons with shared rules: the agreement with the ASADA was your best insurance.');
  ok(has('datos'),'Session 8 · You communicated with evidence: progress, not perfection. Transparency turned the rumor into a conversation.');
  ok(has('integrado')&&has('ia_validada'),'Session 9 · You integrated the pieces across six capitals and used AI to broaden options without giving up judgment.');
  ok(has('legado'),'Session 9 · You intervened in rules and information, not just parameters: the next crisis will find a system.');
  ok(has('guardianes'),'You built capabilities into the team: delegation had something to lean on, and burnout met resistance.');
  ok(has('apoyo')||has('familia')||has('ritmo'),'You looked after your personal sustainability: you negotiated rhythm and support before burning out.');
  miss(has('green')||has('claim_neutral'),'At some point your communication outran the evidence: greenwashing charges interest, and it collected.');
  miss(has('pipas')||has('diesel'),'You treated symptoms by exporting costs to the aquifer, the town or the cash: water trucks and diesel buy time, and they buy conflict.');
  miss(has('despidos')||has('recorte_horas')||has('terceriza'),'You relieved the cash by breaking capabilities and local jobs: in high-standard service, people are the system.');
  miss(has('gaming'),'A badly designed incentive produced gaming: an isolated improvement was rewarded at the guest’s expense.');
  miss(has('litigio')||has('negacion')||has('fila'),'You treated a stakeholder with legitimacy as if it had no power; it gained that power within a week.');
  miss(has('ia_ciega'),'You delegated judgment to AI in the caution zone: unvalidated causal claims and facts reached the board.');
  miss(!has('asada'),'Without a structural agreement with the community, every drought will be a battle over the aquifer all over again.');
  miss(!has('linea_base'),'Without a baseline, the hotel’s sustainability remained a claim, not evidence.');
  miss(S.bie<50,'The personal cost was high. Leadership that burns out is not sustainable, by definition.');
  const tc=totalCuts(), maxc=Math.max(...Object.values(CUTS));
  miss(tc>=8||maxc>=5,`You financed the strategy with cuts (${tc}): the savings showed up in the cash and the cost came in through other accounts: maintenance, people, channel or evidence. Cutting isn’t a strategy; it’s a transfer with a delay.`);
  ok(tc>0&&tc<=5&&maxc<=2&&S.eco>=70,`You used cuts as a bridge, not as a strategy: only a few (${tc}), spread out, without breaking capabilities.`);
  ok(tc===0&&S.eco>=80,'You reached the economic excellence zone without cutting: the margin came from redesigning, not from squeezing.');
  return L.slice(0,8).join('');
}

  else if(stageIdx>=STAGES.length-1 && LOG.length>=24) t+=`Result: ${verdict().t}\n`;
  const tc=totalCuts(); if(tc) t+=`Spending cuts: ${tc} (${Object.keys(CUTS).filter(k=>CUTS[k]).map(k=>CUTAREAS[k].n+' ×'+CUTS[k]).join(', ')})\n`;
  t+='\nDecisions:\n'+LOG.map(l=>`- ${l.et}: ${l.l}${l.cut?' [cut: '+l.cut+']':''}`).join('\n');
  const done=()=>{const old=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=old,1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{fb(t);done();});}
  else{fb(t);done();}
  function fb(x){const ta=document.createElement('textarea');ta.value=x;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);}
}

intro();
</script>
